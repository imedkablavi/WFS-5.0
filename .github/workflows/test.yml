name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Syntax check
        run: |
          python3 -m py_compile wfs_recover.py
          python3 -m py_compile review_server.py

      - name: Unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: CLI smoke test
        run: |
          python3 wfs_recover.py --version
          python3 wfs_recover.py --help
          python3 wfs_recover.py review --help

      - name: Synthetic end-to-end integration test
        run: python3 tests/integration_synthetic.py
