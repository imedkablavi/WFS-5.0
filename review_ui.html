<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WFS Review Console</title>
<style>
:root{color-scheme:dark;--bg:#0b0e13;--panel:#121824;--line:#273244;--muted:#8fa0b7;--text:#eef4ff;--good:#42d392;--warn:#ffc857;--bad:#ff667a;--blue:#64a8ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px system-ui,sans-serif}header{position:sticky;top:0;z-index:4;background:#0b0e13ee;border-bottom:1px solid var(--line);padding:14px 20px}h1{font-size:20px;margin:0 0 7px}.muted{color:var(--muted)}main{padding:18px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.big{font-size:21px;font-weight:700}.toolbar,.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.toolbar{margin-bottom:10px}button,select,input{background:#161f2e;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}button{cursor:pointer}button:hover{border-color:var(--blue)}button:disabled{opacity:.4;cursor:not-allowed}.good{background:#123126}.danger{background:#35151c;color:#ffdbe1}.pass{color:var(--good)}.review{color:var(--warn)}.fail{color:var(--bad)}table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}th,td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{background:#151d2a;position:sticky;top:89px;z-index:2}.reason{max-width:340px}.preview{display:none;margin-top:8px}.preview.open{display:block}video{width:min(720px,75vw);max-height:430px;background:#000}.toast{display:none;position:fixed;right:18px;bottom:18px;background:#172130;border:1px solid var(--line);padding:12px;border-radius:9px;z-index:10}@media(max-width:900px){table,tbody,tr,td{display:block}thead{display:none}td{border:0;padding:6px 10px}tr{border-bottom:2px solid var(--line)}}
</style></head><body>
<header><h1>WFS Review Console <span id="mode" class="muted"></span></h1><div id="root" class="muted"></div></header><main>
<div id="stats" class="stats"></div>
<div class="toolbar"><input id="search" type="search" placeholder="Filter filename / time / reason"><select id="qc"><option value="">All QC</option><option>PASS</option><option>REVIEW</option><option>FAIL</option><option>UNTRACKED</option></select><select id="decision"><option value="">All decisions</option><option value="unreviewed">Unreviewed</option><option value="keep">Keep</option><option value="review">Review</option><option value="discard">Discard</option><option value="deleted">Deleted</option></select><select id="sort"><option value="time">Time</option><option value="size-desc">Largest first</option><option value="size-asc">Smallest first</option><option value="qc">QC status</option></select><button onclick="refresh()">Refresh</button><button class="good" onclick="bulkMark('keep')">KEEP selected</button><button onclick="bulkMark('review')">REVIEW selected</button><button onclick="bulkMark('discard')">DISCARD selected</button><button id="bulkDelete" class="danger" onclick="deleteSelected()">Delete selected</button><a id="csv" target="_blank"><button>Review CSV</button></a></div>
<div id="selection" class="muted" style="margin:8px 0">0 selected</div>
<table><thead><tr><th><input id="all" type="checkbox"></th><th>Video</th><th>QC / decision</th><th>Technical</th><th>Reasons / notes</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></main><div id="toast" class="toast"></div>
<script>
const TOKEN=__TOKEN__;let DATA={items:[]};const selected=new Set();const $=x=>document.getElementById(x),esc=x=>String(x??'');
function bytes(n){n=Number(n||0);for(const u of ['B','KiB','MiB','GiB','TiB']){if(n<1024||u==='TiB')return n.toFixed(n<10&&u!=='B'?2:1)+' '+u;n/=1024}}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
async function api(path,opt={}){opt.headers=Object.assign({'X-WFS-Token':TOKEN,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(path,opt),j=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw Error(j.error||r.statusText);return j}
function media(p){return '/media/'+p.split('/').map(encodeURIComponent).join('/')+'?token='+encodeURIComponent(TOKEN)}
function filtered(){const q=$('search').value.toLowerCase(),qc=$('qc').value,d=$('decision').value;let a=DATA.items.filter(x=>(!qc||x.status===qc)&&(!d||x.decision===d)&&(!q||JSON.stringify([x.name,x.segment,x.reasons,x.note]).toLowerCase().includes(q)));const s=$('sort').value;if(s==='size-desc')a.sort((a,b)=>b.size-a.size);else if(s==='size-asc')a.sort((a,b)=>a.size-b.size);else if(s==='qc')a.sort((a,b)=>esc(a.status).localeCompare(esc(b.status)));else a.sort((a,b)=>esc(a.segment).localeCompare(esc(b.segment))||Number(a.slot||0)-Number(b.slot||0)||a.name.localeCompare(b.name));return a}
function cell(tr){const td=document.createElement('td');tr.appendChild(td);return td}function btn(t,fn,c=''){const b=document.createElement('button');b.textContent=t;b.onclick=fn;b.className=c;return b}
function render(){
 $('root').textContent=DATA.root||'';$('mode').textContent=DATA.delete_enabled?'• DELETE ENABLED':'• read-only review';$('bulkDelete').disabled=!DATA.delete_enabled;$('csv').href='/review.csv?token='+encodeURIComponent(TOKEN);
 const live=DATA.items.filter(x=>x.exists),total=live.reduce((s,x)=>s+x.size,0),disk=DATA.disk||{};$('stats').innerHTML='';for(const [k,v] of [['Files',live.length],['Video size',bytes(total)],['Free space',bytes(disk.free)],['KEEP',DATA.counts?.keep||0],['DISCARD',DATA.counts?.discard||0],['Deleted',DATA.counts?.deleted||0]]){const c=document.createElement('div');c.className='card';const b=document.createElement('div');b.className='big';b.textContent=v;const m=document.createElement('div');m.className='muted';m.textContent=k;c.append(b,m);$('stats').appendChild(c)}
 const tb=$('rows');tb.innerHTML='';for(const x of filtered()){const tr=document.createElement('tr'),c0=cell(tr),cb=document.createElement('input');cb.type='checkbox';cb.disabled=!x.exists;cb.checked=selected.has(x.path);cb.onchange=()=>{cb.checked?selected.add(x.path):selected.delete(x.path);selection()};c0.appendChild(cb);
 const c1=cell(tr),title=document.createElement('strong');title.textContent=x.name;c1.append(title,document.createElement('br'));const meta=document.createElement('span');meta.className='muted';meta.textContent=`${x.segment||''} candidate${x.slot||'?'} • ${bytes(x.size)}`;c1.append(meta);if(x.exists){const p=document.createElement('div');p.className='preview';const v=document.createElement('video');v.controls=true;v.preload='metadata';v.src=media(x.path);p.appendChild(v);c1.append(document.createElement('br'),btn('▶ Preview',()=>p.classList.toggle('open')),p)}
 const c2=cell(tr),q=document.createElement('div');q.textContent=x.status;q.className=esc(x.status).toLowerCase();c2.appendChild(q);const d=document.createElement('div');d.textContent=x.decision;c2.appendChild(d);if(x.deleted_at){const z=document.createElement('div');z.className='muted';z.textContent=x.deleted_at;c2.appendChild(z)}
 const c3=cell(tr);c3.textContent=`FPS ${esc(x.fps)} | ${Number(x.duration||0).toFixed(1)}s | packets ${esc(x.packets)} | coverage ${x.coverage!==''?(Number(x.coverage)*100).toFixed(2)+'%':''}`;
 const c4=cell(tr);c4.className='reason';c4.textContent=(Array.isArray(x.reasons)?x.reasons.join('; '):esc(x.reasons))+(x.note?'\nNote: '+x.note:'');
 const c5=cell(tr);c5.className='actions';if(x.exists){c5.append(btn('KEEP',()=>markOne(x,'keep'),'good'),btn('REVIEW',()=>markOne(x,'review')),btn('DISCARD',()=>markOne(x,'discard')),btn('Note',()=>noteOne(x)));const del=btn('🗑 Delete',()=>deleteOne(x),'danger');del.disabled=!DATA.delete_enabled;c5.appendChild(del)}tb.appendChild(tr)}selection()}
function selection(){const a=DATA.items.filter(x=>selected.has(x.path)&&x.exists);$('selection').textContent=`${a.length} selected • ${bytes(a.reduce((s,x)=>s+x.size,0))}`}
async function refresh(){DATA=await api('/api/items');for(const p of [...selected])if(!DATA.items.some(x=>x.path===p&&x.exists))selected.delete(p);render()}
async function markOne(x,d,n=x.note||''){await api('/api/decision',{method:'POST',body:JSON.stringify({path:x.path,decision:d,note:n})});await refresh()}
async function noteOne(x){const n=prompt('Review note:',x.note||'');if(n!==null)await markOne(x,x.decision==='deleted'?'review':x.decision,n)}
async function bulkMark(d){const a=DATA.items.filter(x=>selected.has(x.path)&&x.exists);for(const x of a)await api('/api/decision',{method:'POST',body:JSON.stringify({path:x.path,decision:d,note:x.note||''})});toast(`Marked ${a.length} as ${d}`);await refresh()}
async function deleteOne(x){if(!DATA.delete_enabled)return;if(x.decision==='keep'&&!confirm('This file is marked KEEP. Force delete it anyway?'))return;if(!confirm(`Delete recovered video?\n\n${x.name}\n${bytes(x.size)}\n\nManifest and audit entry will remain.`))return;try{await api('/api/delete',{method:'POST',body:JSON.stringify({path:x.path,expected_size:x.size,force:x.decision==='keep'})});selected.delete(x.path);toast('Deleted '+x.name);await refresh()}catch(e){alert(e.message)}}
async function deleteSelected(){const a=DATA.items.filter(x=>selected.has(x.path)&&x.exists);if(!a.length)return;const protectedFiles=a.filter(x=>x.decision==='keep');if(protectedFiles.length){alert(`Blocked: ${protectedFiles.length} selected file(s) are marked KEEP.`);return}const sz=a.reduce((s,x)=>s+x.size,0);if(!confirm(`Delete ${a.length} recovered videos and free about ${bytes(sz)}?\n\nManifest and audit records remain.`))return;let ok=0,err=[];for(const x of a){try{await api('/api/delete',{method:'POST',body:JSON.stringify({path:x.path,expected_size:x.size})});selected.delete(x.path);ok++}catch(e){err.push(x.name+': '+e.message)}}toast(`Deleted ${ok}`);if(err.length)alert(err.join('\n'));await refresh()}
$('search').oninput=render;$('qc').onchange=render;$('decision').onchange=render;$('sort').onchange=render;$('all').onchange=e=>{for(const x of filtered())if(x.exists)e.target.checked?selected.add(x.path):selected.delete(x.path);render()};refresh().catch(e=>document.body.textContent='Error: '+e.message);
</script></body></html>
