<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WFS Review</title>
<style>
:root{color-scheme:dark;--bg:#0a0e14;--p:#121925;--l:#2a3547;--m:#93a4b8;--t:#eef4ff;--g:#4ad69a;--w:#ffd166;--r:#ff667a;--b:#72aeff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px system-ui,sans-serif}button,select,input{background:#172232;color:var(--t);border:1px solid var(--l);border-radius:8px;padding:8px}button{cursor:pointer}.good{background:#123326}.bad{background:#39171e}.muted{color:var(--m)}header{position:sticky;top:0;z-index:9;background:#0a0e14ee;border-bottom:1px solid var(--l);padding:12px 18px}main{padding:15px;max-width:1700px;margin:auto}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.card,.player,.table{background:var(--p);border:1px solid var(--l);border-radius:12px}.card{padding:10px}.big{font-size:19px;font-weight:750}.player{display:none;grid-template-columns:1.5fr .5fr;gap:12px;padding:12px;margin:10px 0}.player.open{display:grid}video{width:100%;max-height:60vh;background:#000}.bar,.actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0}.speed.active{border-color:var(--b)}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.toolbar input{min-width:240px;flex:1}.table{overflow:auto;max-height:65vh}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid var(--l);vertical-align:top;text-align:left}th{position:sticky;top:0;background:#151e2b}.pass{color:var(--g)}.review{color:var(--w)}.fail{color:var(--r)}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:20;align-items:center;justify-content:center}.modal.open{display:flex}.box{width:min(600px,95vw);background:#151e2b;border:1px solid var(--l);border-radius:12px;padding:15px}.list{max-height:230px;overflow:auto;white-space:pre-wrap;background:#0d131c;padding:8px;border-radius:8px}.toast{display:none;position:fixed;right:15px;bottom:15px;background:#172232;border:1px solid var(--l);padding:10px;border-radius:8px}@media(max-width:900px){.player.open{grid-template-columns:1fr}table,tbody,tr,td{display:block}thead{display:none}td{border:0}}
</style></head><body>
<header><b>WFS Review Console <span id="ver" class="muted"></span></b><div id="root" class="muted"></div></header><main>
<div id="stats" class="stats"></div>
<div id="pp" class="player"><div><video id="v" controls preload="metadata"></video><div class="bar"><button id="back">↶ 5s</button><button id="ppb">Play/Pause</button><button id="fwd">5s ↷</button><span>Speed</span><button class="speed active" data-r="1">1×</button><button class="speed" data-r="2">2×</button><button class="speed" data-r="5">5×</button><span id="clock" class="muted"></span></div><div class="muted">Keyboard: Space • ←/→ = ±5 sec • 1/2/5 = speed</div></div><div><h3 id="title"></h3><div id="meta" class="muted"></div><div class="actions"><button id="keep" class="good">KEEP</button><button id="review">REVIEW</button><button id="discard">DISCARD</button><button id="del" class="bad">🗑 Delete</button><button id="close">Close</button></div><pre id="info"></pre></div></div>
<div class="toolbar"><input id="q" type="search" placeholder="Search"><select id="qc"><option value="">All QC</option><option>PASS</option><option>REVIEW</option><option>FAIL</option><option>UNTRACKED</option></select><select id="dec"><option value="">All review</option><option value="unreviewed">Unreviewed</option><option value="keep">KEEP</option><option value="review">REVIEW</option><option value="discard">DISCARD</option><option value="deleted">Deleted</option></select><button id="refresh">Refresh</button><button id="allDiscard">Select DISCARD</button><button id="deleteSel" class="bad">Delete selected</button><button id="sync">Sync storage</button></div><div id="sel" class="muted"></div>
<div class="table"><table><thead><tr><th><input id="all" type="checkbox"></th><th>Video</th><th>QC / Review</th><th>Technical</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><div id="toast" class="toast"></div><div id="modal" class="modal"><div class="box"><h3>Confirm deletion</h3><div id="mtext"></div><pre id="mlist" class="list"></pre><label><input id="sure" type="checkbox"> I understand these recovered copies will be removed.</label><div class="actions"><button id="cancel">Cancel</button><button id="go" class="bad" disabled>Delete</button></div></div></div>
<script>
let D={items:[]},cur=null,pending=[];const S=new Set(),$=x=>document.getElementById(x);
function bytes(n){n=Number(n||0);for(const u of ['B','KiB','MiB','GiB']){if(n<1024||u==='GiB')return n.toFixed(1)+' '+u;n/=1024}}
function tm(s){s=Math.max(0,Number(s||0));return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}
async function api(p,o={}){o.headers=Object.assign({'Content-Type':'application/json'},o.headers||{});const r=await fetch(p,o),j=await r.json().catch(()=>({error:r.statusText}));if(!r.ok&&r.status!==207)throw Error(j.error||r.statusText);return j}
function media(p){return '/media/'+p.split('/').map(encodeURIComponent).join('/')}
function filt(){let q=$('q').value.toLowerCase(),qc=$('qc').value,d=$('dec').value;return D.items.filter(x=>(!qc||x.status===qc)&&(!d||x.decision===d)&&(!q||JSON.stringify(x).toLowerCase().includes(q))).sort((a,b)=>(a.segment||'').localeCompare(b.segment||'')||Number(a.slot||999)-Number(b.slot||999))}
function stats(){let p=D.progress||{},disk=D.disk||{},live=D.items.filter(x=>x.exists);$('ver').textContent='v'+D.version;$('root').textContent=D.root+' • '+D.video_root;$('deleteSel').disabled=!D.delete_enabled;$('del').disabled=!D.delete_enabled||!cur;let cards=[['Files',live.length],['Video',bytes(D.video_bytes)],['Free',bytes(disk.free)],['Reviewed',(p.percent||0)+'%'],['KEEP',D.counts?.keep||0],['DISCARD',D.counts?.discard||0],['Reclaimable',bytes(D.discard_bytes)],['Deleted',D.counts?.deleted||0]];$('stats').innerHTML='';for(let [k,v] of cards){let c=document.createElement('div');c.className='card';c.innerHTML='<div class="big"></div><div class="muted"></div>';c.children[0].textContent=v;c.children[1].textContent=k;$('stats').append(c)}}
function render(){stats();let tb=$('rows');tb.innerHTML='';for(let x of filt()){let tr=document.createElement('tr'),c=document.createElement('td'),cb=document.createElement('input');cb.type='checkbox';cb.disabled=!x.exists;cb.checked=S.has(x.path);cb.onchange=()=>{cb.checked?S.add(x.path):S.delete(x.path);selection()};c.append(cb);tr.append(c);let n=document.createElement('td');n.innerHTML='<b></b><div class="muted"></div>';n.children[0].textContent=x.name;n.children[1].textContent=`${x.segment||'--'} • candidate ${x.slot||'?'} • ${bytes(x.size)}`;if(x.exists){let b=document.createElement('button');b.textContent='▶ Open';b.onclick=()=>open(x);n.append(b)}tr.append(n);let q=document.createElement('td');q.innerHTML='<b></b><div></div>';q.children[0].textContent=x.status;q.children[0].className=(x.status||'').toLowerCase();q.children[1].textContent=x.decision;tr.append(q);let t=document.createElement('td');t.textContent=`FPS ${x.fps||'?'} | ${x.duration?Number(x.duration).toFixed(1)+'s':'?'} | packets ${x.packets||'?'} | coverage ${x.coverage!==''?(Number(x.coverage)*100).toFixed(2)+'%':'?'}`;tr.append(t);let a=document.createElement('td');for(let [lab,d] of [['KEEP','keep'],['REVIEW','review'],['DISCARD','discard']]){let b=document.createElement('button');b.textContent=lab;b.onclick=()=>mark(x,d);a.append(b)}if(x.exists){let b=document.createElement('button');b.textContent='🗑';b.className='bad';b.disabled=!D.delete_enabled;b.onclick=()=>ask([x]);a.append(b)}tr.append(a);tb.append(tr)}selection()}
function selection(){let a=D.items.filter(x=>S.has(x.path)&&x.exists);$('sel').textContent=`${a.length} selected • ${bytes(a.reduce((s,x)=>s+x.size,0))}`}
async function refresh(){D=await api('/api/items');for(let p of [...S])if(!D.items.some(x=>x.path===p&&x.exists))S.delete(p);if(cur)cur=D.items.find(x=>x.path===cur.path)||null;render();if(cur)side()}
function open(x){cur=x;let v=$('v');v.pause();v.src=media(x.path);v.playbackRate=1;rates(1);v.load();$('pp').classList.add('open');side();scrollTo({top:0,behavior:'smooth'})}
function side(){if(!cur)return;$('title').textContent=cur.name;$('meta').textContent=`${cur.segment||'--'} • candidate ${cur.slot||'?'} • ${bytes(cur.size)} • ${cur.status} • ${cur.decision}`;$('info').textContent=`Reasons: ${(cur.reasons||[]).join('; ')||'none'}\nNote: ${cur.note||'none'}\nSHA256: ${cur.sha256||'not recorded'}`;$('del').disabled=!D.delete_enabled}
function seek(n){let v=$('v');v.currentTime=Math.max(0,Math.min(Number.isFinite(v.duration)?v.duration:1e12,v.currentTime+n))}
function rates(r){for(let b of document.querySelectorAll('.speed'))b.classList.toggle('active',Number(b.dataset.r)===Number(r))}
function rate(r){$('v').playbackRate=Number(r);rates(r);toast(r+'×')}
async function mark(x,d){await api('/api/decision',{method:'POST',body:JSON.stringify({path:x.path,decision:d})});await refresh()}
async function ask(items){if(!D.delete_enabled)return;let plan=(await api('/api/delete-plan',{method:'POST',body:JSON.stringify({entries:items.map(x=>({path:x.path}))})})).plan;if(plan.protected.length)alert('Blocked by policy:\n'+plan.protected.join('\n'));let ok=new Set(plan.accepted);pending=items.filter(x=>ok.has(x.path));if(!pending.length)return;$('mtext').textContent=`Delete ${pending.length} file(s), about ${bytes(pending.reduce((s,x)=>s+x.size,0))}?`;$('mlist').textContent=pending.map(x=>x.name+' — '+bytes(x.size)).join('\n');$('sure').checked=false;$('go').disabled=true;$('modal').classList.add('open')}
async function go(){let items=[...pending];if(cur&&items.some(x=>x.path===cur.path)){let v=$('v');v.pause();v.removeAttribute('src');v.load();await new Promise(r=>setTimeout(r,100))}let r=await api('/api/delete-bulk',{method:'POST',body:JSON.stringify({entries:items.map(x=>({path:x.path,expected_size:x.size,expected_token:x.file_token}))})});for(let x of items)S.delete(x.path);closeM();cur=null;$('pp').classList.remove('open');if(r.errors?.length)alert(`Deleted ${r.deleted}; failed ${r.failed}\n`+r.errors.map(e=>e.path+': '+e.error).join('\n'));else toast(`Deleted ${r.deleted} • ${bytes(r.bytes_removed)}`);await refresh()}
function closeM(){$('modal').classList.remove('open');pending=[]}
$('refresh').onclick=refresh;$('q').oninput=render;$('qc').onchange=render;$('dec').onchange=render;$('all').onchange=e=>{for(let x of filt())if(x.exists)e.target.checked?S.add(x.path):S.delete(x.path);render()};$('allDiscard').onclick=()=>{S.clear();for(let x of D.items)if(x.exists&&x.decision==='discard')S.add(x.path);render()};$('deleteSel').onclick=()=>ask(D.items.filter(x=>S.has(x.path)&&x.exists));$('sync').onclick=async()=>{await api('/api/sync',{method:'POST',body:'{}'});toast('Storage synced')};
$('back').onclick=()=>seek(-5);$('fwd').onclick=()=>seek(5);$('ppb').onclick=()=>{let v=$('v');v.paused?v.play():v.pause()};for(let b of document.querySelectorAll('.speed'))b.onclick=()=>rate(b.dataset.r);$('v').ontimeupdate=()=>{$('clock').textContent=tm($('v').currentTime)+' / '+tm($('v').duration)};
$('keep').onclick=()=>cur&&mark(cur,'keep');$('review').onclick=()=>cur&&mark(cur,'review');$('discard').onclick=()=>cur&&mark(cur,'discard');$('del').onclick=()=>cur&&ask([cur]);$('close').onclick=()=>{let v=$('v');v.pause();v.removeAttribute('src');v.load();cur=null;$('pp').classList.remove('open')};
$('sure').onchange=e=>$('go').disabled=!e.target.checked;$('go').onclick=go;$('cancel').onclick=closeM;
document.onkeydown=e=>{if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName)||!cur)return;if(e.code==='Space'){e.preventDefault();let v=$('v');v.paused?v.play():v.pause()}else if(e.key==='ArrowLeft'){e.preventDefault();seek(-5)}else if(e.key==='ArrowRight'){e.preventDefault();seek(5)}else if(['1','2','5'].includes(e.key))rate(e.key)};
refresh().catch(e=>document.body.textContent='Error: '+e.message);
</script></body></html>
